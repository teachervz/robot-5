<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورقة الروبوت للطباعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap">
<script src="qrcode.js"></script>
<style>
[hidden] { display: none !important; }
/* Layout: one A4 night-sky sheet. Title stack on top, robot in a glowing orb
   beside a white QR card, three steps along the bottom. */
:root {
  --bg0: #07061a; --bg1: #15113d; --text: #f2f0ff; --muted: #b3afd8;
  --violet: #7c5cff; --violet-hi: #a48bff; --pink: #e57ad3; --sky: #8fd3ff;
  --stroke: rgba(176,164,255,.3);
  --display: "Alexandria", "Tajawal", Tahoma, sans-serif;
  --body: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: #d9d7e6; color: #1b1740; font-family: var(--body); }

.panel {
  max-width: 210mm; margin: 20px auto 16px; padding: 16px 18px; background: #fff; border-radius: 16px;
  display: grid; gap: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
}
.panel h1 { margin: 0; font-family: var(--display); font-size: 22px; }
.panel p { margin: 0; color: #5a5680; font-size: 15px; }
.panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.panel label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
.panel input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid #e2e0ef; direction: rtl; }
.panel input[type="url"] { direction: ltr; text-align: left; }
.panel button { justify-self: start; font: inherit; font-weight: 800; font-size: 17px; border: 0; border-radius: 12px; padding: 12px 22px; background: linear-gradient(270deg, #8b6bff, #5b4bff); color: #fff; cursor: pointer; }

/* ---------- A4 ---------- */
.page {
  width: 210mm; height: 297mm; margin: 0 auto 30px; position: relative; overflow: hidden;
  color: var(--text);
  background:
    radial-gradient(60% 40% at 90% 5%, rgba(124,92,255,.45), transparent 70%),
    radial-gradient(55% 35% at 5% 95%, rgba(229,122,211,.25), transparent 70%),
    radial-gradient(45% 35% at 0% 40%, rgba(143,211,255,.14), transparent 70%),
    linear-gradient(165deg, var(--bg1), var(--bg0) 62%);
  padding: 16mm 16mm 14mm;
  display: grid; grid-template-rows: auto 1fr auto; gap: 7mm;
  box-shadow: 0 6px 30px rgba(0,0,0,.2);
}
#net { position: absolute; inset: 0; width: 100%; height: 100%; }
.page > *:not(#net) { position: relative; }

.chip {
  display: inline-flex; align-items: center; gap: 2mm; border-radius: 99px; padding: 1.4mm 4.5mm;
  font-weight: 700; font-size: 11pt; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .4mm var(--stroke);
}
.chip svg { width: 4.2mm; height: 4.2mm; color: var(--violet-hi); }
.head { display: grid; gap: 3mm; justify-items: start; }
.head .school { justify-self: center; margin-bottom: 2mm; }
.head h2 { margin: 0; width: 100%; line-height: 0; }
.head h2 canvas { width: 178mm; height: 30mm; display: block; }
.head .sub { font-family: var(--display); font-weight: 500; font-size: 17pt; margin: 0; }
.head .meta { display: flex; gap: 3mm; flex-wrap: wrap; }

.middle { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; align-items: center; }
.botcol { position: relative; display: grid; justify-items: center; }
.orb {
  width: 70mm; height: 70mm; border-radius: 50%; position: relative; display: grid; place-items: end center;
  background: radial-gradient(circle at 40% 32%, #ffffff, #ece6ff 42%, #b9a6ff 78%, #8d74ff);
  box-shadow: 0 0 0 3mm rgba(124,92,255,.22), 0 0 18mm 3mm rgba(124,92,255,.55);
}
.orb::before { content: ""; position: absolute; inset: -9mm; border-radius: 50%; border: .5mm dashed rgba(143,211,255,.55); }
.orb img { width: 46mm; margin-bottom: 7mm; display: block; filter: drop-shadow(0 3mm 3mm rgba(20,10,60,.35)); }
.say {
  margin-top: 9mm; text-align: center; font-family: var(--display); font-weight: 700; font-size: 14pt; line-height: 1.45;
  background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 .4mm var(--stroke); border-radius: 5mm; padding: 3mm 5mm;
}

.qrcard {
  justify-self: center; display: grid; justify-items: center; gap: 3mm;
  background: #fff; color: #14113a; border-radius: 7mm; padding: 6mm 6mm 5mm;
  box-shadow: 0 0 0 1.5mm rgba(164,139,255,.5), 0 0 14mm rgba(124,92,255,.5);
}
.qrbox { width: 62mm; height: 62mm; position: relative; padding: 3mm; }
.qrbox i { position: absolute; width: 10mm; height: 10mm; border: 1.8mm solid var(--violet); }
.qrbox i:nth-child(1) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 3mm 0 0; }
.qrbox i:nth-child(2) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 3mm 0 0 0; }
.qrbox i:nth-child(3) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 3mm 0; }
.qrbox i:nth-child(4) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 3mm; }
#qr { position: absolute; inset: 5mm; display: grid; place-items: center; }
#qr svg { width: 100%; height: 100%; display: block; }
.qrcard b { font-family: var(--display); font-weight: 800; font-size: 17pt; }
.empty { width: 100%; height: 100%; border: .4mm dashed #8a86b0; border-radius: 3mm; display: grid; place-items: center; text-align: center; font-size: 10pt; color: #5a5680; padding: 3mm; }

.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4mm; }
.steps li {
  counter-increment: s; display: grid; gap: 2mm; justify-items: center; text-align: center;
  background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .4mm var(--stroke); border-radius: 5mm; padding: 4.5mm 3mm;
  font-size: 12.5pt; font-weight: 700; line-height: 1.4;
}
.steps li::before {
  content: counter(s, arabic-indic); width: 9mm; height: 9mm; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(270deg, #8b6bff, #5b4bff); color: #fff; font-size: 12pt;
}

@page { size: A4; margin: 0; }
@media print {
  body { background: none; }
  .panel { display: none; }
  .page { margin: 0; box-shadow: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media screen and (max-width: 840px) { .page { zoom: .45; } }
</style>
</head>
<body>

<section class="panel">
  <h1>جهّزي الورقة للطباعة</h1>
  <p>الرابط يتعبّى تلقائياً لو فتحتي الصفحة من موقعك. تأكدي منه، وعدّلي النصوص لو تبين، وبعدين اطبعي على ورق A4 بالألوان.</p>
  <div class="grid">
    <label>رابط صفحة الروبوت<input id="url" type="url" placeholder="https://..."></label>
    <label>اسم المدرسة<input id="school" type="text" value=""></label>
    <label>المادة والصف<input id="subject" type="text" value="التقنية الرقمية • الصف الأول الثانوي"></label>
    <label>عنوان الدرس<input id="lesson" type="text" value="الذكاء الاصطناعي"></label>
    <label>العنوان الفرعي<input id="lessonSub" type="text" value="حين تتعلّم الآلة"></label>
    <label>المعلمة<input id="teacher" type="text" value="هدى الدهّاس"></label>
  </div>
  <button id="printBtn" type="button">اطبعي الورقة</button>
</section>

<main class="page">
  <canvas id="net" aria-hidden="true"></canvas>
  <header class="head">
    <span class="chip school" id="pSchoolChip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg>
      <span id="pSchool"></span>
    </span>
    <span class="chip" id="pSubject"></span>
    <h2><canvas id="titleCanvas" role="img" aria-label="عنوان الدرس"></canvas></h2>
    <p class="sub" id="pSub"></p>
    <div class="meta">
      <span class="chip" id="pTeacherWrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="pTeacher"></span></span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>تجربة واقع معزز</span>
    </div>
  </header>

  <section class="middle">
    <div class="qrcard">
      <div class="qrbox"><i></i><i></i><i></i><i></i><div id="qr"></div></div>
      <b>امسحيني</b>
    </div>
    <div class="botcol">
      <div class="orb"><img src="robot.png" alt="الروبوت ذكي"></div>
    </div>
  </section>

  <ol class="steps">
    <li>امسحي الرمز بكاميرا الجوال</li>
    <li>اضغطي «ابدئي التجربة» واسمحي بالكاميرا</li>
  </ol>
</main>

<script>
const $ = (id) => document.getElementById(id);
function guessURL() { return /^https?:/.test(location.protocol) ? location.href.replace(/sheet\.html.*$/, "") : ""; }
function drawQR() {
  const url = $("url").value.trim(), box = $("qr");
  if (!url) { box.innerHTML = '<div class="empty">حطّي رابط الصفحة فوق ويطلع الرمز هنا</div>'; return; }
  try { const q = qrcode(0, "M"); q.addData(url); q.make(); box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  catch (e) { box.innerHTML = '<div class="empty">الرابط طويل جداً</div>'; }
}
function syncText() {
  const v = (id) => $(id).value.trim();
  $("pSchool").textContent = v("school"); $("pSchoolChip").hidden = !v("school");
  $("pSubject").textContent = v("subject"); $("pSubject").hidden = !v("subject");
  drawTitle(v("lesson") || "الذكاء الاصطناعي");
  $("pSub").textContent = v("lessonSub"); $("pSub").hidden = !v("lessonSub");
  $("pTeacher").textContent = "أ. " + v("teacher").replace(/^أ\.\s*/, ""); $("pTeacherWrap").hidden = !v("teacher");
}
async function drawTitle(text) {
  const c = $("titleCanvas"), S = 14; // px per mm
  c.width = 178 * S; c.height = 30 * S;
  const ctx = c.getContext("2d");
  try { await document.fonts.load("900 120px Alexandria", text); } catch (e) {}
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.direction = "rtl"; ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  let size = 19 * S;
  ctx.font = `900 ${size}px Alexandria, Tajawal, sans-serif`;
  while (ctx.measureText(text).width > c.width - 4 && size > 40) { size -= 4; ctx.font = `900 ${size}px Alexandria, Tajawal, sans-serif`; }
  const g = ctx.createLinearGradient(c.width, 0, c.width - ctx.measureText(text).width, 0);
  g.addColorStop(0, "#e57ad3"); g.addColorStop(.55, "#a48bff"); g.addColorStop(1, "#8fd3ff");
  ctx.fillStyle = g;
  ctx.fillText(text, c.width - 2, 21 * S);
}
(function drawNet() {
  const c = $("net"), ctx = c.getContext("2d");
  const w = c.clientWidth, h = c.clientHeight; c.width = w * 2; c.height = h * 2; ctx.scale(2, 2);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pts = Array.from({ length: 70 }, () => [rnd() * w, rnd() * h]);
  pts.forEach((p, i) => pts.slice(i + 1).forEach((q) => {
    const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
    if (d < 130) { ctx.strokeStyle = `rgba(164,139,255,${.2 * (1 - d / 130)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke(); }
  }));
  pts.forEach(([x, y]) => { ctx.fillStyle = "rgba(200,190,255,.6)"; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); });
})();
$("url").value = guessURL();
$("url").addEventListener("input", drawQR);
["school", "subject", "lesson", "lessonSub", "teacher"].forEach((id) => $(id).addEventListener("input", syncText));
$("printBtn").addEventListener("click", () => window.print());
drawQR(); syncText();
</script>
</body>
</html>
